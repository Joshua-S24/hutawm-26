{% extends 'base.html' %}
{% block head %}{% endblock %}

{% block title %}Register{% endblock %}

{% block header %}
<h1>Login</h1>
{% endblock %}

{% block body %}

<form method="post">
    <label for="username">Username</label><br>
    <input type="text" id="username" name="username" value="{{ username or '' }}" required><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" size="20" autocomplete="email" required><br>

    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" size="20" autocomplete="new-password" required><br>

    <button type="submit">Login</button>
    <h3>Don't have an account?</h3>
    <a href="{{ url_for('auth.register') }}">Register here</a>
</form>
{% endblock %}
